<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,300..500&family=Lora:ital,wght@0,400;0,500;1,400&family=Jost:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#FFFFFF; --cream-2:#F7F6F3; --wine:#380E10; --ink:#2B2620; --bronze:#A8834A;
    --radius-sm:8px; --radius-lg:14px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--cream);color:var(--ink);font-family:'Lora',serif;line-height:1.6;padding:48px 20px 80px}
  .wrap{max-width:640px;margin:0 auto}
  h1{font-family:'Bodoni Moda',serif;font-weight:400;font-size:clamp(26px,5vw,34px);margin-bottom:6px}
  .sub{font-family:'Jost',sans-serif;font-size:12px;letter-spacing:1.5px;text-transform:uppercase;color:var(--bronze);margin-bottom:36px;display:block}

  .row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;margin-bottom:32px}
  @media(max-width:520px){.row{grid-template-columns:1fr}}
  .field label{display:block;font-family:'Jost',sans-serif;font-size:11px;letter-spacing:1px;text-transform:uppercase;opacity:0.7;margin-bottom:6px}
  input[type="number"]{width:100%;font-family:'Lora',serif;font-size:15px;color:var(--ink);border:1px solid rgba(43,38,32,0.25);border-radius:var(--radius-sm);padding:11px 12px;background:var(--cream)}

  h2.section{font-family:'Jost',sans-serif;font-size:12px;letter-spacing:1.5px;text-transform:uppercase;color:var(--bronze);margin-bottom:14px}
  .gastos{display:grid;grid-template-columns:1fr 100px;gap:10px 14px;margin-bottom:12px}
  .gastos label{font-size:14px;align-self:center}
  .add-row{background:none;border:1px dashed rgba(43,38,32,0.35);border-radius:var(--radius-sm);padding:10px;font-family:'Jost',sans-serif;font-size:12px;letter-spacing:1px;text-transform:uppercase;color:var(--ink);cursor:pointer;width:100%;margin-bottom:36px}
  .add-row:hover{background:var(--cream-2)}

  .results{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
  @media(max-width:520px){.results{grid-template-columns:1fr}}
  .card{background:var(--cream-2);border-radius:var(--radius-lg);padding:20px}
  .card.big{background:var(--wine);color:var(--cream)}
  .card p.label{font-family:'Jost',sans-serif;font-size:11px;letter-spacing:1px;text-transform:uppercase;opacity:0.75;margin-bottom:6px}
  .card p.value{font-family:'Bodoni Moda',serif;font-weight:400;font-size:26px}
  .small-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  @media(max-width:520px){.small-grid{grid-template-columns:1fr}}
  .small-grid .card p.value{font-size:18px}

  .note{font-family:'Jost',sans-serif;font-size:12px;opacity:0.55;margin-top:28px;text-align:center}
</style>

<div class="wrap">
  <h1>Calculadora de precio</h1>
  <span class="sub">Iconic Pastelería · uso interno</span>

  <div class="row">
    <div class="field"><label>Costo de producción</label><input type="number" id="costo" value="20" step="1"></div>
    <div class="field"><label>Ganancia por tarta</label><input type="number" id="ganancia" value="40" step="1"></div>
    <div class="field"><label>IVA (%)</label><input type="number" id="iva" value="21" step="1"></div>
  </div>

  <h2 class="section">Gastos fijos mensuales</h2>
  <div class="gastos" id="gastos"></div>
  <button class="add-row" id="add-gasto">+ Agregar gasto</button>

  <div class="results">
    <div class="card big">
      <p class="label">Precio final al cliente</p>
      <p class="value" id="out-precio">-</p>
    </div>
    <div class="card big">
      <p class="label">Tartas para cubrir gastos fijos</p>
      <p class="value" id="out-breakeven">-</p>
    </div>
  </div>

  <div class="small-grid">
    <div class="card"><p class="label">Base sin IVA</p><p class="value" id="out-base">-</p></div>
    <div class="card"><p class="label">IVA a repercutir</p><p class="value" id="out-iva">-</p></div>
    <div class="card"><p class="label">Gastos fijos totales</p><p class="value" id="out-fijos">-</p></div>
  </div>

  <p class="note">Los valores se guardan solo en este navegador — no se envían a ningún lado.</p>
</div>

<script>
  const STORAGE_KEY = 'iconic-calc-v1';

  function cargar(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : null;
    }catch(e){ return null; }
  }

  function guardar(data){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); }catch(e){}
  }

  const guardado = cargar();
  const gastosDefault = [["Capcut",24],["Claude",20],["Agua",40],["Luz",40],["Alquiler",200],["Publicidad",200],["Gestor",40]];
  let gastos = (guardado && guardado.gastos) ? guardado.gastos : gastosDefault;

  if(guardado){
    document.getElementById('costo').value = guardado.costo ?? 20;
    document.getElementById('ganancia').value = guardado.ganancia ?? 40;
    document.getElementById('iva').value = guardado.iva ?? 21;
  }

  const gastosEl = document.getElementById('gastos');

  function renderGastos(){
    gastosEl.innerHTML = '';
    gastos.forEach((g, i)=>{
      const label = document.createElement('input');
      label.type = 'text';
      label.value = g[0];
      label.style.cssText = 'border:none;background:none;font-family:Lora,serif;font-size:14px;padding:6px 0';
      label.addEventListener('input', ()=>{ gastos[i][0] = label.value; persistirYCalcular(); });

      const input = document.createElement('input');
      input.type = 'number';
      input.value = g[1];
      input.step = '1';
      input.addEventListener('input', ()=>{ gastos[i][1] = parseFloat(input.value) || 0; persistirYCalcular(); });

      gastosEl.appendChild(label);
      gastosEl.appendChild(input);
    });
  }

  document.getElementById('add-gasto').addEventListener('click', ()=>{
    gastos.push(['Nuevo gasto', 0]);
    renderGastos();
    persistirYCalcular();
  });

  const fmt = n => new Intl.NumberFormat('es-ES', {minimumFractionDigits:2, maximumFractionDigits:2}).format(n) + '€';

  function calcular(){
    const costo = parseFloat(document.getElementById('costo').value) || 0;
    const ganancia = parseFloat(document.getElementById('ganancia').value) || 0;
    const ivaPct = parseFloat(document.getElementById('iva').value) || 0;

    let gastosFijos = 0;
    gastos.forEach(g=>{ gastosFijos += g[1]; });

    const base = costo + ganancia;
    const ivaMonto = base * (ivaPct / 100);
    const precioFinal = base + ivaMonto;
    const breakeven = ganancia > 0 ? Math.ceil(gastosFijos / ganancia) : 0;

    document.getElementById('out-base').textContent = fmt(base);
    document.getElementById('out-iva').textContent = fmt(ivaMonto);
    document.getElementById('out-precio').textContent = fmt(precioFinal);
    document.getElementById('out-fijos').textContent = fmt(gastosFijos);
    document.getElementById('out-breakeven').textContent = breakeven + ' tartas';
  }

  function persistirYCalcular(){
    guardar({
      costo: document.getElementById('costo').value,
      ganancia: document.getElementById('ganancia').value,
      iva: document.getElementById('iva').value,
      gastos: gastos
    });
    calcular();
  }

  document.getElementById('costo').addEventListener('input', persistirYCalcular);
  document.getElementById('ganancia').addEventListener('input', persistirYCalcular);
  document.getElementById('iva').addEventListener('input', persistirYCalcular);

  renderGastos();
  calcular();
</script>
